# cargo-about config for the third-party license bundle shipped in lc-rs.tar.gz.
# The accepted list mirrors deny.toml's [licenses].allow (plus OpenSSL, which
# ring/aws-lc-rs carry as a combined notice). Build- and dev-only deps are not
# linked into the distributed exaudfclient binary, so they are excluded.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
    "OpenSSL",
]

ignore-build-dependencies = true
ignore-dev-dependencies = true

# The shipped exaudfclient is a glibc binary (built with no --target), and the
# UDF artifacts it loads are glibc-dynamic cdylibs — nothing musl is distributed,
# so only the glibc (gnu) triples are scanned. Both arches are listed because
# cargo-about UNIONS the license scan across all `targets`: omitting a triple
# silently drops that platform's dependencies from the notice file.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
]
