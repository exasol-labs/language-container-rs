[package]
name = "bench-udfs"
publish = false
version = "0.1.0"
license.workspace = true
edition = "2024"
description = "Benchmark UDF entry points shared by the Tier 1 protocol bench and the Tier 2 end-to-end bench."

[lib]
name = "bench_udfs"
crate-type = ["cdylib"]

# `emit-arrow` for the `_batch` entry points (`ctx.emit_batch`). The
# `UdfContext` vtable is feature-independent, so no other feature parity with
# the host is required.
[dependencies]
bench-schema = { path = "../bench-schema" }
exasol-udf-sdk = { path = "../../crates/exasol-udf-sdk", features = ["emit-arrow"] }
exasol-udf-macros = { path = "../../crates/exasol-udf-macros" }
arrow = { workspace = true }
chrono = { workspace = true }

[dev-dependencies]
exasol-udf-sdk = { path = "../../crates/exasol-udf-sdk", features = ["test-support"] }
