[package]
name = "scalar-emit-bench-udf"
publish = false
version = "0.1.0"
license.workspace = true
edition = "2024"

[lib]
name = "scalar_emit_bench_udf"
crate-type = ["cdylib"]

[dependencies]
exasol-udf-sdk = { path = "../../crates/exasol-udf-sdk" }
exasol-udf-macros = { path = "../../crates/exasol-udf-macros" }
chrono = { workspace = true }

[dev-dependencies]
exasol-udf-sdk = { path = "../../crates/exasol-udf-sdk", features = ["test-support"] }
