[workspace]
resolver = "2"
members = [
    "crates/exa-proto",
    "crates/exa-zmq-protocol",
    "crates/exasol-udf-sdk",
    "crates/exasol-udf-macros",
    "crates/exa-udf-runtime",
    "crates/exaudfclient",
    "crates/cargo-exasol-udf",
    "crates/it",
    "test-udfs/scalar-double",
    "test-udfs/set-filter",
    "test-udfs/json-parse",
    "test-udfs/single-call-fixture",
    "test-udfs/annotated-fixture",
    "test-udfs/connect-back-query",
    "test-udfs/connect-back-scalar",
    "test-udfs/connect-back-insert",
    "test-udfs/connect-back-crunch",
    "test-udfs/connect-back-cluster-ip",
    "test-udfs/resolv-udf",
    "test-udfs/emit-bulk",
    "test-udfs/emit-arrow-batch",
    "test-udfs/connect-back-stream",
    "test-udfs/timestamp-add-second",
    "test-udfs/timestamp-now",
    "test-udfs/timestamp-passthrough",
    "test-udfs/numeric-temporal-emit",
    "test-udfs/numeric-temporal-ingest",
    "test-udfs/handshake-meta",
    "test-udfs/current-user-meta",
    "test-udfs/set-sum",
    "test-udfs/emit-k",
    "test-udfs/scalar-next-illegal",
    "test-udfs/returns-with-emit",
    "test-udfs/column-meta",
    "test-udfs/timestamp-precision",
    "test-udfs/type-probe",
    "benches/bench-schema",
    "benches/bench-udfs",
    "benches/udf-bench",
    "crates/exa-mock-db",
]
# `it` requires a live Exasol container; build/test it explicitly:
# `cargo test -p it --features integration`
default-members = [
    "crates/exa-proto",
    "crates/exa-zmq-protocol",
    "crates/exasol-udf-sdk",
    "crates/exasol-udf-macros",
    "crates/exa-udf-runtime",
    "crates/exaudfclient",
    "crates/cargo-exasol-udf",
    "test-udfs/scalar-double",
    "test-udfs/set-filter",
    "test-udfs/json-parse",
    "test-udfs/single-call-fixture",
    "test-udfs/annotated-fixture",
    "test-udfs/connect-back-query",
    "test-udfs/connect-back-insert",
    "test-udfs/connect-back-crunch",
    "test-udfs/connect-back-cluster-ip",
    "test-udfs/resolv-udf",
    "test-udfs/emit-bulk",
    "test-udfs/emit-arrow-batch",
    "test-udfs/connect-back-stream",
    "test-udfs/timestamp-add-second",
    "test-udfs/timestamp-now",
    "test-udfs/timestamp-passthrough",
    "test-udfs/numeric-temporal-emit",
    "test-udfs/numeric-temporal-ingest",
    "test-udfs/handshake-meta",
    "test-udfs/current-user-meta",
    "test-udfs/set-sum",
    "test-udfs/emit-k",
    "test-udfs/scalar-next-illegal",
    "test-udfs/returns-with-emit",
    "test-udfs/column-meta",
    "test-udfs/timestamp-precision",
    "test-udfs/type-probe",
]

[workspace.package]
version = "0.28.1"
license = "MIT"
repository = "https://github.com/exasol-labs/language-container-rs"
homepage = "https://github.com/exasol-labs/language-container-rs"

[workspace.dependencies]
# Internal SDK, published to crates.io. The `version` here MUST track
# [workspace.package].version so dependents publish against the matching release.
exasol-udf-sdk = { path = "crates/exasol-udf-sdk", version = "0.28.1" }
prost = "0.13"
prost-build = "0.13"
prost-types = "0.13"
zmq = "0.10"
libloading = "0.8"
libc = "0.2"
arrow = { version = "58", default-features = false, features = ["ipc"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
testcontainers = { version = "0.23", features = ["http_wait"] }
reqwest = { version = "0.12", features = ["blocking"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "2"
proc-macro2 = "1"
quote = "1"
syn = { version = "2", features = ["full"] }
exarrow-rs = { version = "^0.13.0", features = ["websocket"] }
chrono = "0.4"
itoa = "1"
# Benchmark suite (benches/, crates/exa-mock-db): Tier 1 harness and Tier 2
# driver/CLI/JSON. None of these enter the shipped binary.
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
goblin = { version = "0.9", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }

[profile.release]
strip = "symbols"
opt-level = 3
