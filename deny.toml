# The benchmark crates are `publish = false` and never ship; keep them out of the license/advisory scan.
[graph]
# Same triples as about.toml; other targets pull deps we never build (e.g. wasm32-only webpki-root-certs).
targets = ["x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]
exclude = ["udf-bench", "bench-udfs", "bench-schema", "exa-mock-db"]

[advisories]
ignore = []

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "0BSD",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "Unicode-3.0",
]
# Workspace crates are all MIT; internal ones are publish = false. Don't check
# our own crates against the dependency allow-list, only third-party deps.
private = { ignore = true }
