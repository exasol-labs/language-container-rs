[package]
name = "exa-udf-runtime"
publish = false
version.workspace = true
license.workspace = true
edition = "2024"

[dependencies]
exa-proto = { path = "../exa-proto" }
exa-zmq-protocol = { path = "../exa-zmq-protocol" }
exasol-udf-sdk = { path = "../exasol-udf-sdk" }
chrono = { workspace = true }
libloading = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
libc = { workspace = true }
serde_json = { workspace = true }
arrow = { workspace = true, optional = true }
exarrow-rs = { workspace = true, optional = true }
rustls = { version = "0.23", features = ["aws_lc_rs"], optional = true }
tokio = { workspace = true, optional = true }
# Fast digit formatter for the string-block emit fast-path
# (`fast_decimal_to_string`); always compiled.
itoa = { workspace = true }
# Fixture cdylib for the `emit-arrow-test` gated test. It lives here rather than
# in `[dev-dependencies]` only because Cargo rejects optional dev-dependencies,
# and it must stay optional: as a plain dev-dependency it enables
# `exasol-udf-sdk/emit-arrow` for every test run (dev-dependency features unify
# into the crate under test), so a featureless `cargo test` would stop covering
# the SDK's emit-arrow-off configuration. Nothing links it — it is cdylib-only;
# the entry exists purely so Cargo builds and rebuilds the artifact.
emit-arrow-batch = { path = "../../test-udfs/emit-arrow-batch", optional = true }

[features]
emit-arrow = ["exasol-udf-sdk/emit-arrow", "dep:arrow"]
connect-back = ["emit-arrow", "dep:exarrow-rs", "dep:rustls", "dep:tokio"]
# Test-only. Deliberately NOT implied by `connect-back`, so the fixture enters
# neither the production graph nor the default test graph. Implies `emit-arrow`,
# so `--features emit-arrow-test` alone runs `tests/emit_arrow_dlopen.rs`;
# `--all-features` (what CI's coverage job uses) also covers it.
emit-arrow-test = ["emit-arrow", "dep:emit-arrow-batch"]

[dev-dependencies]
zmq = { workspace = true }
prost = { workspace = true }
tracing-subscriber = { workspace = true }
# Fixture cdylibs the integration tests dlopen. Declaring them as dependencies
# is what makes Cargo build them before the tests and rebuild them when their
# sources change; `tests/common/mod.rs` resolves the artifact path.
annotated-fixture = { path = "../../test-udfs/annotated-fixture" }
emit-k = { path = "../../test-udfs/emit-k" }
returns-with-emit = { path = "../../test-udfs/returns-with-emit" }
scalar-double = { path = "../../test-udfs/scalar-double" }
scalar-next-illegal = { path = "../../test-udfs/scalar-next-illegal" }
set-sum = { path = "../../test-udfs/set-sum" }
single-call-fixture = { path = "../../test-udfs/single-call-fixture" }
