[package]
name = "exasol-udf-sdk"
version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
edition = "2024"
description = "SDK for writing Exasol UDFs in Rust: UdfRun/UdfContext traits, Value/ExaType, and the Arrow bridge."

[dependencies]
thiserror = { workspace = true }
chrono = { workspace = true }
tracing = { workspace = true }
arrow = { workspace = true, optional = true }

[features]
emit-arrow = ["dep:arrow"]
# Ships the `test_support` UdfContext doubles. Enables nothing else on purpose:
# dev-dependency features unify into the crate under test, so any implied
# feature here would silently change a dependent's featureless test build.
test-support = []
