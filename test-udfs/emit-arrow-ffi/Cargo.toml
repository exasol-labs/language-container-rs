[package]
name = "emit-arrow-ffi"
publish = false
version = "0.1.0"
license.workspace = true
edition = "2024"

[lib]
name = "emit_arrow_ffi"
crate-type = ["cdylib"]

[dependencies]
exasol-udf-sdk = { path = "../../crates/exasol-udf-sdk" }
exasol-udf-macros = { path = "../../crates/exasol-udf-macros" }
# Not the workspace arrow: an older major than the SDK's proves the C Data Interface path is version-independent.
arrow = { version = "59", default-features = false, features = ["ffi"] }
