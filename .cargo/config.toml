# Build the test UDFs (glibc cdylib, loaded into the Debian-based SLC):
#   cargo build --release -p scalar-double -p set-filter -p json-parse \
#     -p single-call-fixture -p connect-back-cluster-ip \
#     -p connect-back-query -p connect-back-insert

[target.x86_64-unknown-linux-musl]
linker = "musl-gcc"

[target.aarch64-unknown-linux-musl]
# musl-gcc is the host-arch musl wrapper (musl-tools), mirroring the x86_64
# stanza above: on an aarch64 host it links aarch64 objects.
linker = "musl-gcc"
