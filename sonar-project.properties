sonar.projectKey=exasol-labs_language-container-rs
sonar.organization=exasol-labs

# test-udfs/ and benches/ are fixtures, excluded from sources.
# crates/it/ is the integration-test crate (needs a live Docker DB, not
# compiled during the coverage run) — exclude from source analysis.
sonar.sources=crates
sonar.exclusions=crates/it/**
sonar.tests=crates
sonar.test.inclusions=**/*_tests.rs,crates/*/tests/**,crates/it/**

sonar.rust.lcov.reportPaths=lcov-unit.info
