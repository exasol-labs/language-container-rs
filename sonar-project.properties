sonar.projectKey=exasol-labs_language-container-rs
sonar.organization=exasol-labs

# test-udfs/ and benches/ are fixtures, not product code, so they are not listed.
sonar.sources=crates
sonar.tests=crates
sonar.test.inclusions=**/*_tests.rs,crates/*/tests/**,crates/it/**
sonar.exclusions=**/*_tests.rs,crates/*/tests/**,crates/it/**

sonar.rust.lcov.reportPaths=lcov-unit.info

# Fail the scan step, and so the GitHub check, when the Quality Gate fails.
sonar.qualitygate.wait=true
