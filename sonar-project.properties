sonar.projectKey=exasol-labs_language-container-rs
sonar.organization=exasol-labs

# test-udfs/ and benches/ are fixtures, not product code, so they are not listed.
sonar.sources=crates
sonar.tests=crates
# sonar.sources and sonar.tests overlap (both "crates"), so this list alone
# reclassifies matching files as TEST instead of MAIN — keeping them out of
# production LOC/coverage/duplication while still analyzing them for issues
# under the test rule profile. Do NOT also list these in sonar.exclusions:
# that removes a file from analysis entirely (confirmed in the first scan's
# job log — "Excluded sources: ..." — which silently dropped Clippy/Rust
# findings in test files instead of reporting them as test-code issues).
sonar.test.inclusions=**/*_tests.rs,crates/*/tests/**,crates/it/**

sonar.rust.lcov.reportPaths=lcov-unit.info

# Fail the scan step, and so the GitHub check, when the Quality Gate fails.
sonar.qualitygate.wait=true
